name: 561.group source, public-intake and TUFTE consumer qualification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/ISSUE_TEMPLATE/**
      - src/**
      - scripts/**
      - test/**
      - package.json
      - package-lock.json
      - .npmrc
      - wrangler.jsonc
  pull_request:
    paths:
      - .github/workflows/**
      - .github/ISSUE_TEMPLATE/**
      - src/**
      - scripts/**
      - test/**
      - package.json
      - package-lock.json
      - .npmrc
      - wrangler.jsonc
permissions:
  contents: read

# Candidate tests may be superseded; unlike production, stale CI runs are disposable.
concurrency:
  group: 561-apex-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify-original-apex:
    runs-on: ubuntu-latest
    # Source CI cannot consume an unbounded registry outage or Git fetch.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Read the pinned Group front-door content (Public data repository)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 561-group/561-group-frontdoor-services-section
          ref: 2e00cffb7a029889bd20764ce32d09e5ba5feaf8
          path: content
          ssh-key: ${{ secrets.SITE_CONTENT_DEPLOY_KEY }}
          persist-credentials: false
      - name: Bind front-door content (data/, locales/, authored public/ assets) into the application
        run: node scripts/bind-content.mjs
      - name: Verify and unpack accepted Services and Science release output
        run: |
          node scripts/receive-section-release.mjs \
            content/.section-releases/black-october-20261025.json.gz \
            e814489f534cbd595f9d970651f5c1fe8ff20f02dfc80315b527f0aa94c90db8 "$RUNNER_TEMP/section-release-$GITHUB_RUN_ID" d116b8db9eaaa24c4a270b5e91c9a0f36c365ba8eec3b10c9ec3f23c74298978
      - name: Select one source-qualified UTC publication day
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          const seconds=Number(execFileSync('git',['show','-s','--format=%ct','HEAD'],{encoding:'utf8'}).trim());
          if(!Number.isSafeInteger(seconds)||seconds<=0)throw Error('No admitted git source commit date');
          appendFileSync(process.env.GITHUB_ENV,'SITE_PUBLICATION_DATE='+new Date(seconds*1000).toISOString().slice(0,10)+'\n');
          NODE
      - name: Preserve original untrusted-public-input and manual-release boundary
        run: node --test test/public-intake-boundary.test.mjs
      - name: Exercise original data to compact TUFTE model without a mock supplier
        run: node --test test/home-tufte.test.mjs
      - name: Qualify real source-to-TUFTE brand style before any registry/install
        run: node --test test/brand-source.test.mjs
      - name: Read exact original 561 Group design-token owner (public source)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 561-group/561-group-content-design-services-section
          ref: a5269ac3034b4a6ebaa6c1ccdfa2023b03071d2c
          path: .brand-source
          persist-credentials: false
      - name: Assert pinned original brand source and real TUFTE consumer conformance
        run: node scripts/verify-brand-source.mjs .brand-source
      - name: Exercise the original ARB data, source-release boundaries and Worker receipts without any registry
        run: node --test test/locales-runtime.test.mjs test/i18n.test.mjs test/source-revision.test.mjs test/release-preflight.test.mjs
      - name: Qualify complete authored public artifact graph and exact receipt hashes offline
        run: node test/build.mjs
      - name: Verify one site-owned dependency contract before external registry access
        run: node --test test/fetch-source-contract.test.mjs
      - name: Probe actual TUFTE supplier and published LivingWebServer from locked inputs
        run: |
          set -eu
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'));
          const cfg=readFileSync('.npmrc','utf8');
          const registry=cfg.match(/^@red-cup-engineering:registry=(https:\/\/[^\s]+)$/mu)?.[1] ??
            cfg.match(/^registry=(https:\/\/[^\s]+)$/mu)?.[1];
          const {qualifySuppliers}=await import('./scripts/release-preflight.mjs');
          const selected=qualifySuppliers({manifest:pkg,lock,registry});
          console.log('Source lock selects original published suppliers: '+JSON.stringify(selected));
          console.log('Next original npm ci must fetch, verify integrity and install the actual suppliers.');
          NODE
      - name: Install original TUFTE dependencies and published LivingWebServer
        timeout-minutes: 7
        env:
          npm_config_fetch_retries: '2'
          npm_config_fetch_retry_mintimeout: '1500'
          npm_config_fetch_retry_maxtimeout: '8000'
          npm_config_fetch_timeout: '45000'
        run: |
          test -s package-lock.json || { echo '::error::Missing received source lockfile'; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund
          npm run install:observation
      - name: Qualify one original Worker, renderer and generated public artifact graph
        run: |
          npm run check
          npm test
          npm run build
      - name: Install pinned minimal Chromium browser for real visual reading
        timeout-minutes: 4
        run: npx playwright install --only-shell chromium
      - name: Read actual original TUFTE pages at desktop and mobile viewports
        timeout-minutes: 4
        env:
          ORIGINAL_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run test:visual
      - name: Retain unaccepted mobile and desktop visual specimens
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 561-apex-rendered-visual-candidates
          path: artifacts/brand-visual/
          retention-days: 7
          if-no-files-found: warn
      - name: Bundle the real original Worker and public assets with Cloudflare Wrangler without deployment
        timeout-minutes: 3
        run: |
          npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-edge-bundle
          test -n "$(find .wrangler-edge-bundle -type f -name '*.js' -print -quit)" || {
            echo "::error::No original edge Worker bundle was built."
            exit 1
          }
          echo 'Wrangler built original 561-group-site edge bundle without Cloudflare mutation.'
      - name: Preserve qualified installed dependency lock for independent receiving
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 561-apex-exact-lock-candidate
          path: package-lock.json
          retention-days: 7
          if-no-files-found: error
      - name: Inspect release source and canonical published source inputs
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const read=async path=>readFile(path,'utf8');
          const source=JSON.parse(await read('public/source-revision.json'));
          if(source.sourceCommit!==process.env.GITHUB_SHA || source.repository!=='561-group/561.group') {
            throw Error('Generated site is not this exact source revision');
          }
          const authored=JSON.parse(await read('data/estate.json'));
          const built=JSON.parse(await read('public/estate-records.json'));
          if(JSON.stringify(authored.nodes)!==JSON.stringify(built.nodes)) {
            throw Error('A foreign game catalog silently changed the Group public estate');
          }
          const translated=await read('public/zh-hans/index.html');
          if(!translated.includes('<html'))throw Error('Missing original localized static fallback');
          console.log('Original source artifact graph qualified; no live Cloudflare deployment claimed.');
          NODE

