name: Receive and release the original Market Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-market.yml'
      - '.releases/market/**'
  pull_request:
    paths:
      - '.github/workflows/deploy-market.yml'
      - '.releases/market/**'

permissions:
  contents: read

concurrency:
  group: market-worker-production-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.selection.outputs.ready }}
      revision: ${{ steps.selection.outputs.revision }}
      directory: ${{ steps.selection.outputs.directory }}
      manifest: ${{ steps.selection.outputs.manifest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Check the bounded original Market carrier receiver
        run: |
          node --check .releases/market/release.mjs
          node .releases/market/release.test.mjs
      - name: Read the reviewed immutable artifact selection
        id: selection
        run: node .releases/market/release.mjs select

  release:
    needs: source
    if: needs.source.outputs.ready == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      RELEASE_DIRECTORY: .market-release/${{ needs.source.outputs.directory }}
      RELEASE_MANIFEST: ${{ needs.source.outputs.manifest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Read the exact original Market carrier through existing custody
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 561-group/561-group-frontdoor-services-section
          ref: ${{ needs.source.outputs.revision }}
          path: .market-release
          ssh-key: ${{ secrets.SITE_CONTENT_DEPLOY_KEY }}
          persist-credentials: false
      - name: Restore bounded gzip transport to the exact selected original bytes
        run: node .releases/market/release.mjs receive "$RELEASE_DIRECTORY" "$RELEASE_MANIFEST"
      - name: Receive selected bytes, original source owners and native qualification
        run: node .releases/market/release.mjs verify "$RELEASE_DIRECTORY" "$RELEASE_MANIFEST"
      - name: Stage, independently receive, promote and receive through original owners
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .releases/market/release.mjs release "$RELEASE_DIRECTORY" "$RELEASE_MANIFEST"
      - name: Retain provider and public receiving, including any guarded rollback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-worker-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/market-release/receipt.json
          if-no-files-found: warn
          retention-days: 30
