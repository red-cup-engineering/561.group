name: Publish and receive 561.group (TUFTE + LivingWebServer)
# main is the intended production source, not an unreviewed publication.
# Changes enter through PR source qualification; this release repeats the
# original tests, builds the pinned supplier, deploys, then reads public bytes.
on:
  workflow_dispatch:
    inputs:
      publish_sections:
        description: "Republish the selected Services and Science section bundle"
        type: boolean
        default: false
        required: false
  # The Leader's received alpha-site repair can ship only from an already
  # qualified ORIGINAL main CI push. Untrusted PR runs never deploy.
  workflow_run:
    workflows:
      - "561.group source, public-intake and TUFTE consumer qualification"
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: 561-group-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Refuse any stale or non-main release source before private credentials are used
        env:
          ADMITTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADMITTED_SOURCE_SHA" || { echo "::error::Checked-out source changed"; exit 1; }
          test "$GITHUB_SHA" = "$ADMITTED_SOURCE_SHA" || { echo "::error::Workflow event did not identify the exact main source"; exit 1; }
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$latest" = "$ADMITTED_SOURCE_SHA" || { echo "::error::Another main revision superseded this release"; exit 1; }
          echo "Exact current main $ADMITTED_SOURCE_SHA admitted; no provider change yet."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Read the pinned Group front-door content (Public data repository)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 561-group/561-group-frontdoor-services-section
          ref: b79db484dadc51c4039769a506bebec9f0575db2
          path: content
          ssh-key: ${{ secrets.SITE_CONTENT_DEPLOY_KEY }}
          persist-credentials: false
      - name: Bind front-door content (data/, locales/, authored public/ assets) into the application
        run: node scripts/bind-content.mjs
      - name: Verify and unpack accepted Services and Science release output
        run: |
          node scripts/receive-section-release.mjs \
            content/.section-releases/black-october-20261025.json.gz \
            e814489f534cbd595f9d970651f5c1fe8ff20f02dfc80315b527f0aa94c90db8 "$RUNNER_TEMP/section-release-$GITHUB_RUN_ID" d116b8db9eaaa24c4a270b5e91c9a0f36c365ba8eec3b10c9ec3f23c74298978
      - name: Select one source-qualified UTC publication day
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          const seconds=Number(execFileSync('git',['show','-s','--format=%ct','HEAD'],{encoding:'utf8'}).trim());
          if(!Number.isSafeInteger(seconds)||seconds<=0)throw Error('No admitted git source commit date');
          appendFileSync(process.env.GITHUB_ENV,'SITE_PUBLICATION_DATE='+new Date(seconds*1000).toISOString().slice(0,10)+'\n');
          NODE
      - name: Refuse a production release without the original exact package lock
        run: |
          test -s package-lock.json || {
            echo '::error::The original source has no committed npm lockfile; do not deploy a best-effort install.'
            exit 1
          }
      - name: Install original 561 registry suppliers and pinned LivingWebServer
        timeout-minutes: 7
        env:
          npm_config_fetch_retries: '2'
          npm_config_fetch_retry_mintimeout: '1500'
          npm_config_fetch_retry_maxtimeout: '8000'
          npm_config_fetch_timeout: '45000'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run install:observation
      - name: Qualify the actual original Worker, TUFTE and other retained routes
        run: |
          npm run check
          npm test
          npm run build
      - name: Publish selected sections through their original publisher
        if: github.event_name == 'workflow_dispatch' && inputs.publish_sections
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node "$RUNNER_TEMP/section-release-$GITHUB_RUN_ID/engine/sites/release-bundle.mjs" receive \
            --bundle "$RUNNER_TEMP/section-release-$GITHUB_RUN_ID" \
            --manifest d116b8db9eaaa24c4a270b5e91c9a0f36c365ba8eec3b10c9ec3f23c74298978 \
            --wrangler "$GITHUB_WORKSPACE/node_modules/.bin/wrangler"
      - name: Refresh original apex feeds from the newly published sections
        run: npm run build
      - name: Read pinned original Group brand authority before deploy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 561-group/561-group-content-design-services-section
          ref: a5269ac3034b4a6ebaa6c1ccdfa2023b03071d2c
          path: .brand-source
          persist-credentials: false
      - name: Reject original-house visual drift at the installed TUFTE consumer
        run: node scripts/verify-brand-source.mjs .brand-source
      - name: Install pinned headless Chromium for the original brand release gate
        timeout-minutes: 4
        run: npx playwright install --only-shell chromium
      - name: Refuse to publish a visually regressed TUFTE consumer
        timeout-minutes: 4
        run: npm run test:visual
      - name: Refuse incomplete release, duplicate homepage or wrong source revision
        run: |
          node --input-type=module <<'NODE'
          import { readFile,stat } from 'node:fs/promises';
          const text=async name=>readFile(name,'utf8');
          const receipt=JSON.parse(await text('public/source-revision.json'));
          if(receipt.sourceCommit!==process.env.GITHUB_SHA ||
             receipt.repository!=='561-group/561.group' ||
             receipt.renderer!=='TUFTE' || receipt.application!=='LivingWebServer') {
            throw Error('Source release identity mismatch');
          }
          for(const path of ['public/estate-records.json','public/contact/index.html',
            'public/llms.txt','public/llms-full.txt','public/sitemap.xml',
            'public/robots.txt','public/zh-hans/index.html','public/lkt/index.html']) {
            if((await stat(path)).size<50)throw Error('Missing original publication asset: '+path);
          }
          try { await stat('public/index.html'); throw Error('Competing English static homepage'); }
          catch(error) { if(error.code!=='ENOENT')throw error; }
          const {createHash}=await import('node:crypto');
          const artifacts=Object.entries(receipt.artifactDigests??{});
          if(artifacts.length<10 || receipt.publicationDay!==process.env.SITE_PUBLICATION_DATE) {
            throw Error('Original exact public-artifact manifest incomplete or publication date differs');
          }
          for(const [name,claimed] of artifacts) {
            if(!/^[a-z0-9._/-]+$/iu.test(name) || name.startsWith('/') ||
               name.split('/').includes('..') || !/^sha256:[a-f0-9]{64}$/iu.test(claimed)) {
              throw Error('Unadmitted generated artifact or digest: '+name);
            }
            const actual='sha256:'+createHash('sha256')
              .update(await readFile('public/'+name)).digest('hex');
            if(actual!==claimed)throw Error('Generated artifact differs from its source-qualified public receipt: '+name);
          }
          const living=JSON.parse(await text('node_modules/@red-cup-engineering/living-web-server/package.json'));
          if(!living.exports?.['./fetch'])throw Error('Installed LivingWebServer lacks Worker Fetch contract');
          if(living.dependencies?.['@red-cup-engineering/computer-web-server'] ||
             living.peerDependenciesMeta?.['@red-cup-engineering/computer-web-server']?.optional!==true) {
            throw Error('This Worker release includes unqualified Node transport dependency semantics');
          }
          console.log('Admitted exact TUFTE + LivingWebServer source '+receipt.sourceCommit);
          NODE
      - name: Observe previous public feed before replacing it; route changes to editorial review
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFile,mkdir,writeFile,appendFile} from 'node:fs/promises';
          import {assayPublicFeedProjection,comparePublicFeedRevisions} from './scripts/assay-public-feed.mjs';
          const origin='https://561.group';
          const load=async path=>JSON.parse(await readFile(path,'utf8'));
          const home=await load('data/home.json');
          const sourceRevision=await load('public/source-revision.json');
          if(sourceRevision.sourceCommit!==process.env.GITHUB_SHA)
            throw Error('Proposed publication revision not bound to original main');
          const current={sourceRevision,feed:await load('public/feed.json'),
            receipt:await load('public/feed-input-receipt.json'),
            graph:await load('public/feed-provenance.jsonld')};
          for(const name of ['feed.json','feed-input-receipt.json','feed-provenance.jsonld']){
            const digest='sha256:'+createHash('sha256')
              .update(await readFile('public/'+name)).digest('hex');
            if(sourceRevision.artifactDigests?.[name]!==digest)
              throw Error('Unqualified proposed publication bytes: '+name);
          }
          assayPublicFeedProjection({home,feed:current.feed,
            receipt:current.receipt,graph:current.graph});
          const previousJson=async name=>{
            const url=origin+'/'+name;
            let response;
            try{
              response=await fetch(url,{method:'GET',redirect:'manual',
                cache:'no-store',headers:{accept:'application/json',
                  'accept-encoding':'identity','cache-control':'no-cache'},
                signal:AbortSignal.timeout(10000)});
            }catch(error){
              const out=Error('Prior public release unreachable: '+name);
              out.code='PRIOR_UNAVAILABLE';throw out;
            }
            if(response.status!==200){
              const out=Error('Prior public release HTTP '+response.status+' at '+name);
              out.code='PRIOR_UNAVAILABLE';throw out;
            }
            if(response.redirected||response.url!==url||
               !(response.headers.get('content-type')??'').toLowerCase().includes('json'))
              throw Error('Prior public evidence URL/media identity refused: '+name);
            const chunks=[];let total=0;
            for await(const chunk of response.body){
              total+=chunk.byteLength;
              if(total>2*1024*1024)throw Error('Prior public evidence exceeds 2MiB bound: '+name);
              chunks.push(Buffer.from(chunk));
            }
            const raw=Buffer.concat(chunks,total);
            let body;
            try{body=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(raw));}
            catch{throw Error('Prior public evidence is not exact UTF-8 JSON: '+name);}
            return {body,digest:'sha256:'+createHash('sha256').update(raw).digest('hex')};
          };
          let previous,reason=null;
          try{
            const result=await previousJson('source-revision.json');
            const revision=result.body;
            if(revision.repository!=='561-group/561.group'||
               revision.origin!==origin||revision.renderer!=='TUFTE'||
               revision.application!=='LivingWebServer'||
               !/^[a-f0-9]{40}$/u.test(revision.sourceCommit??''))
              throw Error('Prior source-revision is not an original Group publisher');
            previous={sourceRevision:revision};
            for(const [name,key] of [['feed.json','feed'],
              ['feed-input-receipt.json','receipt'],
              ['feed-provenance.jsonld','graph']]){
              const read=await previousJson(name);
              if(revision.artifactDigests?.[name]!==read.digest)
                throw Error('Prior deployed artifact did not match its manifest: '+name);
              previous[key]=read.body;
            }
          }catch(error){
            if(error.code==='PRIOR_UNAVAILABLE'){reason='prior-public-source-unavailable';previous=null;}
            else throw error;
          }
          const observedAt=new Date().toISOString();
          const report=previous?
            comparePublicFeedRevisions({home,previous,proposed:current,observedAt}):
            {schema:'561.group/publication-transition-review/v1',observedAt,
              scope:'Previous public release was not independently readable; no article withdrawal or revision inferred',
              previousRelease:null,
              proposedRelease:{sourceCommit:sourceRevision.sourceCommit,deployed:false},
              editorialReviewRequired:true,editorialDecision:'not-admitted',
              originalCorrectionPublished:false,reason,
              metadataRevisions:[],identityChanges:[],aggregateExits:[],newlySelected:[]};
          await mkdir('observations',{recursive:true});
          await writeFile('observations/561.group-publication-transition-review.json',
            JSON.stringify(report,null,2)+'\n');
          console.log('Predeploy Group editorial-change evidence: '+JSON.stringify({
            previous:report.previousRelease?.sourceCommit??null,
            proposed:sourceRevision.sourceCommit,counts:report.counts??null,
            editorialReviewRequired:report.editorialReviewRequired,reason}));
          if(report.editorialReviewRequired)
            console.log('::warning::Group feed revisions, aggregate exits or incomplete prior coverage require subject-owned editorial review; no correction/retraction is inferred or automatically published.');
          if(process.env.GITHUB_STEP_SUMMARY)
            await appendFile(process.env.GITHUB_STEP_SUMMARY,
              '### Capped-feed change review (predeploy candidate, not publisher decision)\n'+
              'Previous release '+(report.previousRelease?.sourceCommit??'unavailable')+
              '; proposed '+sourceRevision.sourceCommit+
              '; subject-owned review required '+report.editorialReviewRequired+
              '. Changed metadata '+(report.counts?.metadataRevisions??'unknown')+
              ', identity collisions '+(report.counts?.identityConflicts??'unknown')+
              ', aggregate exits '+(report.counts?.aggregateExits??'unknown')+
              '. No original article correction or withdrawal is inferred.\n\n');
          NODE
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.127.1
          command: deploy --config wrangler.jsonc
      - name: Receive independent public revision, human/agent and retained site routes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const host='https://561.group';
          const read=(path,accept)=>fetch(host+path,{cache:'no-store',headers:{'cache-control':'no-cache',...(accept?{accept}:{})}});
          // Wrangler can finish before the new Worker reaches the public edge.
          // Observe the exact source with a bounded wait; never accept stale
          // HTML, a merely successful upload or an unqualified alias.
          const {awaitPublishedRevision}=await import('./scripts/release-preflight.mjs');
          const receipt=await awaitPublishedRevision({sourceSha:process.env.GITHUB_SHA});
          console.log('Exact public source observed after qualified deploy: '+receipt.sourceCommit);
          // Cloudflare's native active version is distinct from the site's source claim.
          const uuid=/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/iu;
          if(!uuid.test(receipt.workerVersionId??''))throw Error('Public receipt lacks executing Worker version metadata');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/iu.test(account??'')||!token)
            throw Error('Qualified provider read credential unavailable for manual release receiving');
          const provider=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+
            '/workers/scripts/561-group-site/deployments?per_page=10',{
            method:'GET',redirect:'error',cache:'no-store',
            headers:{authorization:'Bearer '+token,accept:'application/json'},
            signal:AbortSignal.timeout(15000)
          });
          if(!provider.ok)throw Error('Cloudflare active-deployment read refused: HTTP '+provider.status);
          const data=await provider.json(),latest=data?.result?.deployments?.[0];
          if(data?.success!==true||!uuid.test(latest?.id??'')||
             latest?.versions?.length!==1||latest.versions[0].percentage!==100||
             latest.versions[0].version_id?.toLowerCase()!==receipt.workerVersionId.toLowerCase()){
            throw Error('Published Worker version is not the Cloudflare active 100%-traffic version');
          }

          // A source commit alone does not attest generated external-feed
          // snapshots. Independently compare original published bytes with
          // their release-time artifact digests at the public origin.
          const {assayPublicFeedProjection,qualifyPublicAssetReadPath,normalizeMarkdownLiteralHyphens}=
            await import('./scripts/assay-public-feed.mjs');
          const publicationBodies=new Map();
          const semanticPublicationPaths=new Set([
            'feed.json','feed-input-receipt.json','feed-provenance.jsonld'
          ]);
          for(const path of ['llms.txt','llms-full.txt','robots.txt','sitemap.xml',
            'feed.json','feed-input-receipt.json','feed-provenance.jsonld',
            'estate-records.json','zh-hans/index.html','lkt/index.html']) {
            const target='/'+path;
            const asset=await read(target);
            if(!asset.ok)throw Error('Original generated public artifact unavailable: '+target+' '+asset.status);
            const route=qualifyPublicAssetReadPath({
              origin:host,path,redirected:asset.redirected,
              responseUrl:asset.url,contentType:asset.headers.get('content-type')
            });
            if(route.mode==='localized-html-redirect')
              console.log('Canonical localized public asset read: '+target+' -> '+route.canonical);
            const raw=await asset.arrayBuffer();
            if(semanticPublicationPaths.has(path)) {
              if(raw.byteLength>2*1024*1024 ||
                 !(asset.headers.get('content-type')??'').toLowerCase().includes('json'))
                throw Error('Public syndication evidence lacks bounded JSON media type: '+target);
              publicationBodies.set(path,new TextDecoder('utf-8',{fatal:true}).decode(raw));
            }
            const bytes=new Uint8Array(await crypto.subtle.digest('SHA-256',raw));
            const digest='sha256:'+Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
            if(receipt.artifactDigests?.[path]!==digest) {
              throw Error('Deployed public bytes differ from original release receipt: '+target);
            }
          }
          // These are the exact already-fetched public bytes, not a second
          // crawler or a check of unpublished checkout-only representations.
          const {readFile}=await import('node:fs/promises');

          const sourceHome=JSON.parse(await readFile('data/home.json','utf8'));
          const feedReceipt=assayPublicFeedProjection({
            home:sourceHome,
            feed:JSON.parse(publicationBodies.get('feed.json')),
            receipt:JSON.parse(publicationBodies.get('feed-input-receipt.json')),
            graph:JSON.parse(publicationBodies.get('feed-provenance.jsonld'))
          });
          console.log('Independent public source/metadata receiving: '+JSON.stringify(feedReceipt));
          // Independently read the actual reader-facing blog, not only its
          // source feed: TUFTE HTML, machine JSON and negotiated Markdown must
          // tell the same truth as the exact public input receipt just fetched.
          const inputReceipt=JSON.parse(publicationBodies.get('feed-input-receipt.json'));
          const expectedCoverage=feedReceipt.observedSourceFeeds+' of '+
            sourceHome.group.companies.length+' original company feeds received';
          const expectedSelection=feedReceipt.admittedItems+' source '+
            (feedReceipt.admittedItems===1?'item':'items')+' admitted, '+
            feedReceipt.emittedItems+' selected';
          const expectedRejected=feedReceipt.excludedItems+' source '+
            (feedReceipt.excludedItems===1?'entry':'entries')+' rejected';
          const expectedOverflow=feedReceipt.omittedByAggregateLimit+
            ' left outside its 60-item selection';
          const expected=[expectedCoverage,expectedSelection,expectedRejected,expectedOverflow];
          const blogHtmlResponse=await read('/blog/','text/html');
          const blogHtml=await blogHtmlResponse.text();
          if(!blogHtmlResponse.ok||blogHtmlResponse.redirected||
             !(blogHtmlResponse.headers.get('content-type')??'').includes('text/html')||
             !blogHtml.includes('href="https://561.group/blog/"')||
             !blogHtml.includes('What this build actually received')||
             !expected.every(term=>blogHtml.includes(term)))
            throw Error('Independent published blog HTML disagrees with qualified source coverage');
          const blogJsonResponse=await read('/blog/','application/json');
          if(!blogJsonResponse.ok||blogJsonResponse.redirected||
             !(blogJsonResponse.headers.get('content-type')??'').includes('application/json'))
            throw Error('Published blog has no original machine-readable source model');
          const blogModel=await blogJsonResponse.json();
          const originalCoverageTile=blogModel?.tiles?.find(tile=>tile.id==='coverage');
          if(blogModel.kind!=='tufte.projection'||
             blogModel.metadata?.canonical!==host+'/blog/'||
             !originalCoverageTile||
             !expected.every(term=>originalCoverageTile.html?.includes(term))||
             !sourceHome.group.companies.every(company=>
               originalCoverageTile.html.includes(company.name) &&
               originalCoverageTile.html.includes(company.feeds.json)))
            throw Error('Published TUFTE blog JSON loses original company and source-receipt evidence');
          const blogMarkdownResponse=await read('/blog/','text/markdown');
          const blogMarkdown=await blogMarkdownResponse.text();
          const normalizedBlogMarkdown=normalizeMarkdownLiteralHyphens(blogMarkdown);
          if(!blogMarkdownResponse.ok||blogMarkdownResponse.redirected||
             !(blogMarkdownResponse.headers.get('content-type')??'').startsWith('text/markdown')||
             !/^(?:#|##) .+/mu.test(blogMarkdown)||
             !expected.every(term=>normalizedBlogMarkdown.includes(term))||
             !normalizedBlogMarkdown.includes('build-time feed input and selection counts'))
            throw Error('Published accessible blog Markdown disagrees with original feed receipt');
          if(inputReceipt.emittedItems!==feedReceipt.emittedItems)
            throw Error('Reader-facing blog is using another source snapshot');
          console.log('Independent published blog reader coverage: '+JSON.stringify({
            sourceCommit:receipt.sourceCommit,
            sources:feedReceipt.observedSourceFeeds,
            sourceItems:feedReceipt.sourceItems,
            selected:feedReceipt.emittedItems,
            rejected:feedReceipt.excludedItems,
            omittedByCap:feedReceipt.omittedByAggregateLimit,
            html:true,json:true,markdown:true
          }));


          // Marketing copy is owned by the public editorial source, not by
          // frozen release-workflow prose. Verify current purpose, not a
          // historical slogan that would make authentic branding undeployable.
          const {readFileSync}=await import('node:fs');
          const frontdoor=JSON.parse(readFileSync('data/frontdoor.json','utf8'));
          // Qualified original Group editorial data is the authority, not
          // frozen search-engine copy. Test its *actual* public representation.
          const escapeEditorialText=value=>String(value).replace(/[&<>"']/gu,
            character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
          const namedQuestions=[frontdoor.discovery,frontdoor.ecologicalDiscovery];
          if(namedQuestions.some(group=>!Array.isArray(group?.questions)||group.questions.length!==3)||
             !frontdoor.ecologicalDiscovery?.boundary?.includes('As of October 27, 2026')||
             !frontdoor.ecologicalDiscovery.nextSteps?.some(next=>
               next.href==='https://services.561.group/climate-water-and-energy-exposure-worksheet/'))
            throw Error('Original Group public ecological questions or observed worksheet release boundaries missing');
          const exactQuestions=(text,group)=>
            group.questions.every(question=>
              text.includes('id="'+question.id+'"')&&
              text.includes('href="'+escapeEditorialText(question.href)+'"')&&
              text.includes(escapeEditorialText(question.question))&&
              text.includes(escapeEditorialText(question.answer)));
          if(typeof frontdoor.proposition!=='string' || !frontdoor.proposition.trim() ||
             !Array.isArray(frontdoor.vision?.frontiers) || frontdoor.vision.frontiers.length!==2 ||
             frontdoor.vision.frontiers.some(f=>typeof f.title!=='string'||!f.title.trim())) {
            throw Error('Original public editorial source has no two complete civilization-building frontiers');
          }
          const home=await read('/','text/html');
          const html=await home.text();
          const homeSignals={status:home.status,contentType:home.headers.get('content-type'),
            tufte:html.includes('data-tufte'),purpose:html.includes(frontdoor.proposition),
            frontiers:frontdoor.vision.frontiers.map(f=>({id:f.id,present:html.includes(f.title)})),
            work:html.includes('Work with us'),checkout:html.includes('buy.stripe.com'),
            invalidLegacyPhrase:html.includes('conurbanized ecosystem')};
          console.log('Independent public home browser-mode receipt: '+JSON.stringify(homeSignals));
          if(!home.ok || !(home.headers.get('content-type')??'').includes('text/html') ||
             !homeSignals.tufte || !homeSignals.purpose || homeSignals.frontiers.some(f=>!f.present) ||
             !homeSignals.work || !homeSignals.checkout ||
             !html.includes('href="/work/"') ||
             !html.includes('href="/projects/"') ||
             homeSignals.invalidLegacyPhrase) {
            throw Error('Public HTML does not carry the accepted original 561 Group mission and usable routes');
          }
          const json=await fetch(host+'/',{cache:'no-store',headers:{accept:'application/json',cookie:'lang=en'}});
          if(!json.ok || !(json.headers.get('content-type')||'').includes('application/json')) {
            throw Error('Public LivingWebServer JSON projection was not received');
          }
          // The user asked for a usable public website, not a verified five-box
          // deployment. Receive the four actual visitor journeys separately:
          // what can be hired, what can be visited, how the Group works and
          // how an authorized agent discovers source-owned interfaces.
          for(const page of [
            {path:'/work/',phrase:'Areas we can scope',tile:'services'},
            {path:'/projects/',phrase:'Shop, Bazaar and Market',tile:'trade'},
            {path:'/about/',phrase:'The four accountable companies',tile:'companies'},
            {path:'/for-agents/',phrase:'Published machine-readable interfaces',tile:'endpoints'}
          ]){
            const htmlResponse=await read(page.path,'text/html');
            const markup=await htmlResponse.text();
            if(!htmlResponse.ok ||
               !(htmlResponse.headers.get('content-type')??'').includes('text/html') ||
               !markup.includes('data-tufte') ||
               !markup.includes(page.phrase) ||
               !markup.includes('href="'+host+page.path+'"')) {
              throw Error('Real public visitor route is missing useful original TUFTE content: '+page.path);
            }
            if(page.path==='/about/'&&(
               namedQuestions.some(group=>
                 !markup.includes(escapeEditorialText(group.headline))||
                 !exactQuestions(markup,group))||
               !markup.includes(escapeEditorialText(frontdoor.ecologicalDiscovery.boundary))))
              throw Error('Original ecological and political economy research sources missing from public About HTML');
            const agentResponse=await fetch(host+page.path,{
              cache:'no-store',headers:{accept:'application/json','cache-control':'no-cache'}
            });
            if(!agentResponse.ok ||
               !(agentResponse.headers.get('content-type')??'').includes('application/json')) {
              throw Error('Real public agent projection is absent at '+page.path);
            }
            const model=await agentResponse.json();
            if(model.kind!=='tufte.projection' ||
               model.metadata?.canonical!==host+page.path ||
               !model.tiles?.some(tile=>tile.id===page.tile)) {
              throw Error('Visitor and agent read different or incomplete site models: '+page.path);
            }
            if(page.path==='/about/'){
              const candidates=[
                ['technology-and-power',frontdoor.discovery],
                ['ecology-and-adaptation',frontdoor.ecologicalDiscovery]
              ];
              if(candidates.some(([id,group])=>{
                const tile=model.tiles.find(item=>item.id===id);
                return !tile||!tile.html?.includes(escapeEditorialText(group.headline)) &&
                  !model.metadata?.description?.includes(group.summary)||
                  !exactQuestions(tile.html??'',group);
              })||
              !model.metadata?.description?.includes(frontdoor.discovery.summary)||
              !model.metadata?.description?.includes(frontdoor.ecologicalDiscovery.summary))
                throw Error('Original TUFTE agent model lost authoritative ecological research boundaries');
            }
          }
          // Receive the same original source through the opt-in agent carrier.
          // A successful HTML release must not hide an unavailable Markdown path.
          for(const path of ['/','/work/','/projects/','/about/','/for-agents/']) {
            const response=await read(path,'text/markdown');
            const markdown=await response.text();
            if(response.status!==200 ||
               !(response.headers.get('content-type')??'').startsWith('text/markdown') ||
               !/(?:^|,)\s*Accept\s*(?:,|$)/iu.test(response.headers.get('vary')??'') ||
               !/^# .+/mu.test(markdown) ||
               !markdown.includes('https://561.group/work/') ||
               /<script|<style/u.test(markdown)) {
              throw Error('Original public Markdown representation was not received: '+path);
            }
            if(['/','/work/','/for-agents/'].includes(path))
              for(const offer of frontdoor.selfService.examples)
                if(!markdown.includes(offer.href))throw Error('Markdown lost original merchant link: '+offer.sku);
            if(path==='/about/'){
              const readable=normalizeMarkdownLiteralHyphens(markdown);
              if(!readable.includes(frontdoor.discovery.headline)||
                 !readable.includes(frontdoor.ecologicalDiscovery.headline)||
                 !readable.includes('As of October 27, 2026')||
                 !readable.includes('https://services.561.group/climate-water-and-energy-exposure-worksheet/')||
                 !readable.includes('does not prove a live public edition'))
                throw Error('Original public About Markdown lost the admitted reader evidence and publication status');
              console.log('Independent Group ecological reader evidence received: '+JSON.stringify({
                sourceCommit:receipt.sourceCommit,topics:namedQuestions.length,
                sourceQuestions:frontdoor.discovery.questions.length+frontdoor.ecologicalDiscovery.questions.length,
                receivedWorksheet:true,scienceEditionNotClaimed:true,
                html:true,json:true,markdown:true
              }));
            }
            console.log('Independent public Markdown received: '+path+' '+new TextEncoder().encode(markdown).byteLength+' bytes');
          }
          const markdownHead=await fetch(host+'/',{method:'HEAD',headers:{accept:'text/markdown'}});
          if(markdownHead.status!==200 ||
             !(markdownHead.headers.get('content-type')??'').startsWith('text/markdown') ||
             await markdownHead.text()!=='')throw Error('Public Markdown HEAD was not received');
          const oldRoute=await fetch(host+'/work',{redirect:'manual'});
          if(oldRoute.status!==308 || oldRoute.headers.get('location')!==host+'/work/') {
            throw Error('Human-friendly work route lacks canonical slash redirect');
          }
          const legacy=await fetch(host+'/index.html',{redirect:'manual'});
          if(legacy.status!==301 || legacy.headers.get('location')!==host+'/') {
            throw Error('Legacy static page remains independently reachable');
          }
          for(const route of ['/contact/','/estate.json','/llms.txt','/zh-hans/','/lkt/']) {
            const response=await read(route);
            if(!response.ok)throw Error('Existing public route missing: '+route+' '+response.status);
          }
          const alias=await fetch('https://www.561.group/',{redirect:'manual'});
          if(alias.status!==301 || alias.headers.get('location')!==host+'/') {
            throw Error('www origin no longer canonicalizes');
          }
          console.log('Received deployed Group source '+receipt.sourceCommit+' on actual public origin');
          NODE
      # The same original public observer checks crawling, navigation, security
      # and exact site revision only after production/source/provider receiving.
      # This avoids a third chained workflow_run trigger and an early false
      # negative, without creating a second site audit or provider authority.
      - name: Record original public delivery observation after release
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/observe-production.mjs
      - name: Retain the original post-release public discovery witness
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 561-group-post-release-public-observation
          path: |
            observations/561.group-public-delivery.json
            observations/561.group-publication-transition-review.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain original section publication receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-section-publication-receipts
          path: ${{ runner.temp }}/section-release-${{ github.run_id }}/instance/data/records/section-site-releases/*.json
          if-no-files-found: warn
          retention-days: 30
