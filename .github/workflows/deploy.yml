name: Publish and receive 561.group (TUFTE + LivingWebServer)
# main is the intended production source, not an unreviewed publication.
# Changes enter through PR source qualification; this release repeats the
# original tests, builds the pinned supplier, deploys, then reads public bytes.
on:
  workflow_dispatch:
  # The Leader's received alpha-site repair can ship only from an already
  # qualified ORIGINAL main CI push. Untrusted PR runs never deploy.
  workflow_run:
    workflows:
      - "561.group source, public-intake and TUFTE consumer qualification"
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: 561-group-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Refuse any stale or non-main release source before private credentials are used
        env:
          ADMITTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADMITTED_SOURCE_SHA" || { echo "::error::Checked-out source changed"; exit 1; }
          test "$GITHUB_SHA" = "$ADMITTED_SOURCE_SHA" || { echo "::error::Workflow event did not identify the exact main source"; exit 1; }
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$latest" = "$ADMITTED_SOURCE_SHA" || { echo "::error::Another main revision superseded this release"; exit 1; }
          echo "Exact current main $ADMITTED_SOURCE_SHA admitted; no provider change yet."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Read the pinned Group front-door content (Public data repository)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 561-group/561-group-frontdoor-services-section
          ref: e6ada576cddfab9334ad1c80fd30b92c97ea21aa
          path: content
          ssh-key: ${{ secrets.SITE_CONTENT_DEPLOY_KEY }}
          persist-credentials: false
      - name: Bind front-door content (data/, locales/, authored public/ assets) into the application
        run: node scripts/bind-content.mjs
      - name: Select one source-qualified UTC publication day
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          const seconds=Number(execFileSync('git',['show','-s','--format=%ct','HEAD'],{encoding:'utf8'}).trim());
          if(!Number.isSafeInteger(seconds)||seconds<=0)throw Error('No admitted git source commit date');
          appendFileSync(process.env.GITHUB_ENV,'SITE_PUBLICATION_DATE='+new Date(seconds*1000).toISOString().slice(0,10)+'\n');
          NODE
      - name: Refuse a production release without the original exact package lock
        run: |
          test -s package-lock.json || {
            echo '::error::The original source has no committed npm lockfile; do not deploy a best-effort install.'
            exit 1
          }
      - name: Install original 561 registry suppliers and pinned LivingWebServer
        timeout-minutes: 7
        env:
          npm_config_fetch_retries: '2'
          npm_config_fetch_retry_mintimeout: '1500'
          npm_config_fetch_retry_maxtimeout: '8000'
          npm_config_fetch_timeout: '45000'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Qualify the actual original Worker, TUFTE and other retained routes
        run: |
          npm run check
          npm test
          npm run build
      - name: Read pinned original Group brand authority before deploy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 561-group/561-group-content-design-services-section
          ref: a5269ac3034b4a6ebaa6c1ccdfa2023b03071d2c
          path: .brand-source
          persist-credentials: false
      - name: Reject original-house visual drift at the installed TUFTE consumer
        run: node scripts/verify-brand-source.mjs .brand-source
      - name: Install pinned headless Chromium for the original brand release gate
        timeout-minutes: 4
        run: npx playwright install --only-shell chromium
      - name: Refuse to publish a visually regressed TUFTE consumer
        timeout-minutes: 4
        run: npm run test:visual
      - name: Refuse incomplete release, duplicate homepage or wrong source revision
        run: |
          node --input-type=module <<'NODE'
          import { readFile,stat } from 'node:fs/promises';
          const text=async name=>readFile(name,'utf8');
          const receipt=JSON.parse(await text('public/source-revision.json'));
          if(receipt.sourceCommit!==process.env.GITHUB_SHA ||
             receipt.repository!=='561-group/561.group' ||
             receipt.renderer!=='TUFTE' || receipt.application!=='LivingWebServer') {
            throw Error('Source release identity mismatch');
          }
          for(const path of ['public/estate-records.json','public/contact/index.html',
            'public/llms.txt','public/llms-full.txt','public/sitemap.xml',
            'public/robots.txt','public/zh-hans/index.html','public/lkt/index.html']) {
            if((await stat(path)).size<50)throw Error('Missing original publication asset: '+path);
          }
          try { await stat('public/index.html'); throw Error('Competing English static homepage'); }
          catch(error) { if(error.code!=='ENOENT')throw error; }
          const {createHash}=await import('node:crypto');
          const artifacts=Object.entries(receipt.artifactDigests??{});
          if(artifacts.length<10 || receipt.publicationDay!==process.env.SITE_PUBLICATION_DATE) {
            throw Error('Original exact public-artifact manifest incomplete or publication date differs');
          }
          for(const [name,claimed] of artifacts) {
            if(!/^[a-z0-9._/-]+$/iu.test(name) || name.startsWith('/') ||
               name.split('/').includes('..') || !/^sha256:[a-f0-9]{64}$/iu.test(claimed)) {
              throw Error('Unadmitted generated artifact or digest: '+name);
            }
            const actual='sha256:'+createHash('sha256')
              .update(await readFile('public/'+name)).digest('hex');
            if(actual!==claimed)throw Error('Generated artifact differs from its source-qualified public receipt: '+name);
          }
          const living=JSON.parse(await text('node_modules/@red-cup-engineering/living-web-server/package.json'));
          if(!living.exports?.['./fetch'])throw Error('Installed LivingWebServer lacks Worker Fetch contract');
          if(living.dependencies?.['@red-cup-engineering/computer-web-server'] ||
             living.peerDependenciesMeta?.['@red-cup-engineering/computer-web-server']?.optional!==true) {
            throw Error('This Worker release includes unqualified Node transport dependency semantics');
          }
          console.log('Admitted exact TUFTE + LivingWebServer source '+receipt.sourceCommit);
          NODE
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.127.1
          command: deploy --config wrangler.jsonc
      - name: Receive independent public revision, human/agent and retained site routes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const host='https://561.group';
          const read=(path,accept)=>fetch(host+path,{cache:'no-store',headers:{'cache-control':'no-cache',...(accept?{accept}:{})}});
          // Wrangler can finish before the new Worker reaches the public edge.
          // Observe the exact source with a bounded wait; never accept stale
          // HTML, a merely successful upload or an unqualified alias.
          const {awaitPublishedRevision}=await import('./scripts/release-preflight.mjs');
          const receipt=await awaitPublishedRevision({sourceSha:process.env.GITHUB_SHA});
          console.log('Exact public source observed after qualified deploy: '+receipt.sourceCommit);
          // Cloudflare's native active version is distinct from the site's source claim.
          const uuid=/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/iu;
          if(!uuid.test(receipt.workerVersionId??''))throw Error('Public receipt lacks executing Worker version metadata');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/iu.test(account??'')||!token)
            throw Error('Qualified provider read credential unavailable for manual release receiving');
          const provider=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+
            '/workers/scripts/561-group-site/deployments?per_page=10',{
            method:'GET',redirect:'error',cache:'no-store',
            headers:{authorization:'Bearer '+token,accept:'application/json'},
            signal:AbortSignal.timeout(15000)
          });
          if(!provider.ok)throw Error('Cloudflare active-deployment read refused: HTTP '+provider.status);
          const data=await provider.json(),latest=data?.result?.deployments?.[0];
          if(data?.success!==true||!uuid.test(latest?.id??'')||
             latest?.versions?.length!==1||latest.versions[0].percentage!==100||
             latest.versions[0].version_id?.toLowerCase()!==receipt.workerVersionId.toLowerCase()){
            throw Error('Published Worker version is not the Cloudflare active 100%-traffic version');
          }

          // A source commit alone does not attest generated external-feed
          // snapshots. Independently compare original published bytes with
          // their release-time artifact digests at the public origin.
          for(const path of ['llms.txt','llms-full.txt','robots.txt','sitemap.xml',
            'feed.json','estate-records.json','zh-hans/index.html','lkt/index.html']) {
            const target='/'+path;
            const asset=await read(target);
            if(!asset.ok)throw Error('Original generated public artifact unavailable: '+target+' '+asset.status);
            const raw=await asset.arrayBuffer();
            const bytes=new Uint8Array(await crypto.subtle.digest('SHA-256',raw));
            const digest='sha256:'+Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
            if(receipt.artifactDigests?.[path]!==digest) {
              throw Error('Deployed public bytes differ from original release receipt: '+target);
            }
          }

          // Marketing copy is owned by the public editorial source, not by
          // frozen release-workflow prose. Verify current purpose, not a
          // historical slogan that would make authentic branding undeployable.
          const {readFileSync}=await import('node:fs');
          const frontdoor=JSON.parse(readFileSync('data/frontdoor.json','utf8'));
          if(typeof frontdoor.proposition!=='string' || !frontdoor.proposition.trim() ||
             !Array.isArray(frontdoor.vision?.frontiers) || frontdoor.vision.frontiers.length!==2 ||
             frontdoor.vision.frontiers.some(f=>typeof f.title!=='string'||!f.title.trim())) {
            throw Error('Original public editorial source has no two complete civilization-building frontiers');
          }
          const home=await read('/','text/html');
          const html=await home.text();
          const homeSignals={status:home.status,contentType:home.headers.get('content-type'),
            tufte:html.includes('data-tufte'),purpose:html.includes(frontdoor.proposition),
            frontiers:frontdoor.vision.frontiers.map(f=>({id:f.id,present:html.includes(f.title)})),
            work:html.includes('Work with us'),checkout:html.includes('buy.stripe.com'),
            invalidLegacyPhrase:html.includes('conurbanized ecosystem')};
          console.log('Independent public home browser-mode receipt: '+JSON.stringify(homeSignals));
          if(!home.ok || !(home.headers.get('content-type')??'').includes('text/html') ||
             !homeSignals.tufte || !homeSignals.purpose || homeSignals.frontiers.some(f=>!f.present) ||
             !homeSignals.work || !homeSignals.checkout ||
             !html.includes('href="/work/"') ||
             !html.includes('href="/projects/"') ||
             homeSignals.invalidLegacyPhrase) {
            throw Error('Public HTML does not carry the accepted original 561 Group mission and usable routes');
          }
          const json=await fetch(host+'/',{cache:'no-store',headers:{accept:'application/json',cookie:'lang=en'}});
          if(!json.ok || !(json.headers.get('content-type')||'').includes('application/json')) {
            throw Error('Public LivingWebServer JSON projection was not received');
          }
          // The user asked for a usable public website, not a verified five-box
          // deployment. Receive the four actual visitor journeys separately:
          // what can be hired, what can be visited, how the Group works and
          // how an authorized agent discovers source-owned interfaces.
          for(const page of [
            {path:'/work/',phrase:'Areas we can scope',tile:'services'},
            {path:'/projects/',phrase:'Shop, Bazaar and Market',tile:'trade'},
            {path:'/about/',phrase:'The four accountable companies',tile:'companies'},
            {path:'/for-agents/',phrase:'Published machine-readable interfaces',tile:'endpoints'}
          ]){
            const htmlResponse=await read(page.path,'text/html');
            const markup=await htmlResponse.text();
            if(!htmlResponse.ok ||
               !(htmlResponse.headers.get('content-type')??'').includes('text/html') ||
               !markup.includes('data-tufte') ||
               !markup.includes(page.phrase) ||
               !markup.includes('href="'+host+page.path+'"')) {
              throw Error('Real public visitor route is missing useful original TUFTE content: '+page.path);
            }
            const agentResponse=await fetch(host+page.path,{
              cache:'no-store',headers:{accept:'application/json','cache-control':'no-cache'}
            });
            if(!agentResponse.ok ||
               !(agentResponse.headers.get('content-type')??'').includes('application/json')) {
              throw Error('Real public agent projection is absent at '+page.path);
            }
            const model=await agentResponse.json();
            if(model.kind!=='tufte.projection' ||
               model.metadata?.canonical!==host+page.path ||
               !model.tiles?.some(tile=>tile.id===page.tile)) {
              throw Error('Visitor and agent read different or incomplete site models: '+page.path);
            }
          }
          const oldRoute=await fetch(host+'/work',{redirect:'manual'});
          if(oldRoute.status!==308 || oldRoute.headers.get('location')!==host+'/work/') {
            throw Error('Human-friendly work route lacks canonical slash redirect');
          }
          const legacy=await fetch(host+'/index.html',{redirect:'manual'});
          if(legacy.status!==301 || legacy.headers.get('location')!==host+'/') {
            throw Error('Legacy static page remains independently reachable');
          }
          for(const route of ['/contact/','/estate.json','/llms.txt','/zh-hans/','/lkt/']) {
            const response=await read(route);
            if(!response.ok)throw Error('Existing public route missing: '+route+' '+response.status);
          }
          const alias=await fetch('https://www.561.group/',{redirect:'manual'});
          if(alias.status!==301 || alias.headers.get('location')!==host+'/') {
            throw Error('www origin no longer canonicalizes');
          }
          console.log('Received deployed Group source '+receipt.sourceCommit+' on actual public origin');
          NODE
      # The same original public observer checks crawling, navigation, security
      # and exact site revision only after production/source/provider receiving.
      # This avoids a third chained workflow_run trigger and an early false
      # negative, without creating a second site audit or provider authority.
      - name: Record original public delivery observation after release
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/observe-production.mjs
      - name: Retain the original post-release public discovery witness
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 561-group-post-release-public-observation
          path: observations/561.group-public-delivery.json
          if-no-files-found: warn
          retention-days: 30
