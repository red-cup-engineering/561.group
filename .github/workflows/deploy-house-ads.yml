name: Publish and receive existing house ads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-house-ads.yml'
      - '.releases/house-ads/**'
  pull_request:
    paths:
      - '.github/workflows/deploy-house-ads.yml'
      - '.releases/house-ads/**'

permissions:
  contents: read

concurrency:
  group: house-ads-production-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: 'false'
      npm_config_fetch_retries: '2'
      npm_config_fetch_timeout: '45000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Read the exact already-merged original ads host
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: red-cup-engineering/house-ads-server-site
          ref: 1a58fb576420a0cafc9525b0a1934750b798090e
          path: house-ads
          persist-credentials: false
      - name: Receive the immutable original advertising supplier and lock
        run: node .releases/house-ads/release.mjs prepare
      - name: Install the exact original dependency closure
        working-directory: house-ads
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Qualify the installed original host and existing paid policy
        working-directory: house-ads
        run: |
          npm run check
          npm test
          npm run deploy -- --dry-run --outdir "$RUNNER_TEMP/house-ads-release/worker"
      - name: Receive the identical qualified Worker and catalog bytes
        run: node .releases/house-ads/release.mjs built
      - name: Admit only this current reviewed main before provider access
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          latest="$(git ls-remote https://github.com/red-cup-engineering/561.group.git refs/heads/main | awk '{print $1}')"
          test "$latest" = "$GITHUB_SHA" || { echo '::error::A newer main release superseded this carrier'; exit 1; }
      - name: Bind the existing ads account, receipt namespace and rollback version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .releases/house-ads/release.mjs before
      - name: Deploy through the original ads publisher to its existing target
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: house-ads
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NO_COLOR: '1'
        run: |
          set -euo pipefail
          npm run deploy -- --keep-vars --tag ads-0.3.0-dev.2 \
            --message 'host 1a58fb576420; advertising 2fa6576097ac 0.3.0-dev.2' \
            | tee "$RUNNER_TEMP/house-ads-release/deploy.log"
      - name: Receive active Cloudflare version and exact public catalog
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .releases/house-ads/release.mjs after
      - name: Retain original release and rollback receiving
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: house-ads-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/house-ads-release/before.json
            ${{ runner.temp }}/house-ads-release/receipt.json
          if-no-files-found: ignore
          retention-days: 30
