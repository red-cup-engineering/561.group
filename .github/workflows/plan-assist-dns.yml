name: Plan existing ASSIST DNS recovery

on:
  pull_request:
    paths:
      - '.github/workflows/plan-assist-dns.yml'
      - 'scripts/receive-assist-dns-plan.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/plan-assist-dns.yml'
      - 'scripts/receive-assist-dns-plan.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assist-existing-domain-dns-plan
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check the plan receiver
        run: node --check scripts/receive-assist-dns-plan.mjs

  plan:
    needs: source
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_DIRECTORY: .assist-dns-release/.service-releases/assist-dns-plan/20261026
      RELEASE_MANIFEST: 5cabba08ebb8af2467baae459617c83eda8c57f3daf1296a9143246aae1c6b17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the current reviewed main revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$latest" = "$GITHUB_SHA" || { echo '::error::DNS plan source superseded'; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Read the private original service and existing Sites declarations
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 561-group/561-group-frontdoor-services-section
          ref: 3303c130c8c83446d6b181d1b379ca2f8ab070e8
          path: .assist-dns-release
          ssh-key: ${{ secrets.SITE_CONTENT_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify the pinned original service and exact 15 records
        run: node scripts/receive-assist-dns-plan.mjs verify "$RELEASE_DIRECTORY" "$RELEASE_MANIFEST"
      - name: Check that the reviewed plan is still current
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$latest" = "$GITHUB_SHA" || { echo '::error::DNS plan source superseded'; exit 1; }
      - name: Read the existing Cloudflare zone and records without changing DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/receive-assist-dns-plan.mjs plan "$RELEASE_DIRECTORY" "$RELEASE_MANIFEST" observations/assist-dns-provider-plan.json
      - name: Retain the non-secret provider plan or refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assist-dns-provider-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: observations/assist-dns-provider-plan.json
          if-no-files-found: warn
          retention-days: 14
