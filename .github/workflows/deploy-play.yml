name: Deploy and receive the original Play catalog

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-play.yml'
      - 'scripts/receive-play-release.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-play.yml'
      - 'scripts/receive-play-release.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-production
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check the Play receiver
        run: node --check scripts/receive-play-release.mjs

  release:
    needs: source
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_DIRECTORY: .play-release/.service-releases/play/20261026-canonical
      RELEASE_MANIFEST: c177876531d115c618c5b4ce274f325c058e8f82509ac3f067c02fa7b52e7a1f
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Receive the current Play release inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          git fetch --no-tags --depth=1 origin "$latest"
          git diff --quiet "$GITHUB_SHA" "$latest" -- .github/workflows/deploy-play.yml scripts/receive-play-release.mjs || { echo '::error::Play release inputs superseded'; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Read the private original Play build
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 561-group/561-group-frontdoor-services-section
          ref: a1ea3bd916e795cf698399a5e1646b24c9e7f022
          path: .play-release
          ssh-key: ${{ secrets.SITE_CONTENT_DEPLOY_KEY }}
          persist-credentials: false
      - name: Receive every built file, the original source bindings and the existing target
        run: node scripts/receive-play-release.mjs verify "$RELEASE_DIRECTORY" "$RELEASE_MANIFEST"
      - name: Qualify the original pinned deployment tool before using provider credentials
        run: npx --yes wrangler@4.123.0 deploy --config "$RELEASE_DIRECTORY/wrangler.jsonc" --dry-run --outdir "$RUNNER_TEMP/play-dry-run"
      - name: Check that the reviewed release is still current
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          git fetch --no-tags --depth=1 origin "$latest"
          git diff --quiet "$GITHUB_SHA" "$latest" -- .github/workflows/deploy-play.yml scripts/receive-play-release.mjs || { echo '::error::Play release inputs superseded'; exit 1; }
      - name: Receive the existing Play target before replacing its version
        id: target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/receive-play-release.mjs target "$RELEASE_DIRECTORY" "$RELEASE_MANIFEST" > "$RUNNER_TEMP/play-target.json"
          cat "$RUNNER_TEMP/play-target.json"
          node --input-type=module -e 'import { readFileSync, appendFileSync } from "node:fs"; const target = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/play-target.json")); if (typeof target.alreadyCurrent !== "boolean") throw new Error("Missing exact release decision"); appendFileSync(process.env.GITHUB_OUTPUT, "already-current=" + target.alreadyCurrent + "\n");'
      - name: Deploy the existing Play Worker once
        if: steps.target.outputs.already-current != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.123.0 deploy --config "$RELEASE_DIRECTORY/wrangler.jsonc" --tag "play-${RELEASE_MANIFEST:0:32}"
      - name: Receive the active provider version, original public pages and missing feeds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/receive-play-release.mjs receive "$RELEASE_DIRECTORY" "$RELEASE_MANIFEST" observations/play-production.json
      - name: Retain the provider and public receiving result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: play-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: observations/play-production.json
          if-no-files-found: warn
          retention-days: 14
