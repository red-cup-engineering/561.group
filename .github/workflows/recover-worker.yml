name: Recover 561.group Worker (explicit version only)

# Recovery of the SAME Worker and Cloudflare routes; not a second site publisher.
# This is a manually chosen, prior provider-deployed version, never "previous" by guess.
on:
  workflow_dispatch:
    inputs:
      expected_deployment_id:
        description: "Exact currently active Cloudflare deployment UUID, read from provider"
        required: true
        type: string
      target_version_id:
        description: "Exact earlier 100%-traffic Worker version UUID to restore"
        required: true
        type: string
      confirmation:
        description: "Type exactly ROLLBACK 561.group to authorize this recovery"
        required: true
        type: string

permissions:
  contents: read

# Do not let a rollback race the existing manual production publisher.
concurrency:
  group: 561-group-production
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: 561-group-production-recovery
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install the locked native observation supplier before recovery
        timeout-minutes: 7
        run: npm run install:observation
      - name: Qualify recovery inputs, exact historical provider version and current deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_REF: ${{ github.ref }}
          EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
          RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node --test test/worker-recovery.test.mjs
          node scripts/worker-recovery.mjs preflight
      - name: Restore exactly one operator-selected previously deployed Worker version
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.127.1
          command: rollback ${{ inputs.target_version_id }} --name 561-group-site --config wrangler.jsonc --message "Recovery authorized via GitHub run ${{ github.run_id }}"
      - name: Receive exact replacement from provider-native deployment history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_REF: ${{ github.ref }}
          EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
          RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/worker-recovery.mjs verify
      - name: Independently read the restored public entrypoints
        run: node scripts/observe-production.mjs
      - name: Retain recovery preflight, provider receipt and public HTTP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 561-group-worker-recovery-evidence
          path: |
            observations/561.group-worker-recovery-preflight.json
            observations/561.group-worker-recovery-result.json
            observations/561.group-public-delivery.json
          retention-days: 30
          if-no-files-found: warn
